<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Status Pesanan</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

<style>
:root {
    --gojek-green: #00aa13;
    --gojek-dark: #008b10;
    --bg-soft: #eef7ee;
    --bg-card: #ffffff;
}

body {
    background: var(--bg-soft);
    font-family: 'Inter', sans-serif;
    padding: 28px 14px 50px;
}

.success-box {
    max-width: 500px;
    margin: auto;
    background: var(--bg-card);
    border-radius: 18px;
    padding: 26px;
    box-shadow: 0 8px 26px rgba(0,0,0,0.06);
    animation: fadeIn .4s ease-out;
}

@keyframes fadeIn { from { opacity: 0; transform: translateY(20px);} to { opacity: 1; } }

.header-icon {
    width: 82px;
    height: 82px;
    margin: auto;
    background: var(--gojek-green);
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    color: white;
    font-size: 42px;
    animation: pulse 1.4s infinite ease-in-out;
}

@keyframes pulse {
    0% { transform: scale(.9); }
    50% { transform: scale(1.05); }
    100% { transform: scale(.9); }
}

.timeline {
    margin-top: 24px;
    padding-left: 12px;
    border-left: 3px solid #cfcfcf;
}

.step {
    position: relative;
    padding: 10px 0 10px 20px;
}

.step::before {
    content: "";
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: #cfcfcf;
    position: absolute;
    left: -9px;
    top: 18px;
}

.step.active::before {
    background: var(--gojek-green);
    box-shadow: 0px 0px 0px 5px rgba(0,170,19,0.25);
    animation: zoom .3s ease;
}

@keyframes zoom {
    from { transform: scale(.5); }
    to   { transform: scale(1); }
}

.order-box {
    background: #f3faf3;
    border: 1px solid #d9f2d9;
    padding: 16px;
    border-radius: 14px;
    margin-top: 20px;
}

.courier-box {
    position: relative;
    width: 100%;
    height: 110px;
    overflow: hidden;
    margin-bottom: 18px;
}

.courier {
    position: absolute;
    left: -100px;
    bottom: 5px;
    font-size: 42px;
    color: var(--gojek-green);
    display: flex;
    align-items: center;
    animation: goRide 7s linear infinite;
}

@keyframes goRide {
    0% { left: -120px; opacity: 0; }
    10% { opacity: 1; }
    90% { opacity: 1; }
    100% { left: 110%; opacity: 0; }
}

.btn-gf {
    background: var(--gojek-green);
    color: white;
    border: none;
    padding: 13px;
    font-size: 16px;
    border-radius: 12px;
    width: 100%;
    font-weight: 600;
}

.btn-gf:hover { background: var(--gojek-dark); }

.btn-wa {
    background: #25d366;
    color: #fff;
    border: none;
    padding: 13px;
    border-radius: 12px;
    width: 100%;
    font-weight: 600;
    margin-bottom: 8px;
}
.btn-wa:hover { background: #1fbb54; }
</style>
</head>

<body>

<div class="success-box">

    <div class="courier-box">
        <div class="courier"><i class="bi bi-scooter"></i></div>
    </div>

    <div class="header-icon"><i class="bi bi-check2"></i></div>

    <h3 class="fw-bold text-center mt-3">Pesanan Berhasil!</h3>
    <p class="text-muted text-center">Driver sedang menjemput pesananmu</p>

    <div class="timeline">
        <div class="step active" id="g1">
            <div class="step-title">Pesanan diterima restoran</div>
            <div class="step-desc">Restoran sedang memproses pesananmu</div>
        </div>
        <div class="step" id="g2">
            <div class="step-title">Pesanan sedang disiapkan</div>
            <div class="step-desc">Chef sedang memasak makananmu 🍜</div>
        </div>
        <div class="step" id="g3">
            <div class="step-title">Driver menuju restoran</div>
            <div class="step-desc">Driver OTW ambil pesanan</div>
        </div>
        <div class="step" id="g4">
            <div class="step-title">Pesanan diantar</div>
            <div class="step-desc">Tunggu ya, sebentar lagi sampai!</div>
        </div>
    </div>

    <div class="order-box" id="orderDetail"></div>

    <div class="mt-4">
        <button class="btn-gf mb-2" id="btnPDF">
            <i class="bi bi-file-earmark-pdf me-2"></i>Download Invoice
        </button>
        <button class="btn-wa" id="btnWhatsApp">
            <i class="bi bi-whatsapp me-2"></i>Kirim WhatsApp
        </button>
        <a href="index.html" class="btn btn-outline-secondary w-100" id="btnBack">Kembali ke Menu</a>
    </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.29/jspdf.plugin.autotable.min.js"></script>

<script>
// AMBIL ORDER TERAKHIR
const order = JSON.parse(localStorage.getItem("lastOrder") || "{}");
const box = document.getElementById("orderDetail");

if (!order.id) {
    box.innerHTML = "<b>Order tidak ditemukan</b>";
} else {
    let itemsHTML = "";
    order.items.forEach(i => {
        const qty = i.quantity ?? 1;
        const price = Number(i.price ?? 0);
        itemsHTML += `
        <div class="d-flex justify-content-between">
            <span>${i.name} (${qty}x)</span>
            <b>Rp ${(price * qty).toLocaleString("id-ID")}</b>
        </div>`;
    });

    box.innerHTML = `
        <div><b>ID Pesanan:</b> ${order.id}</div>
        <div><b>Nama:</b> ${order.customer.name}</div>
        <div><b>No HP:</b> ${order.customer.phone}</div>
        <div><b>Alamat:</b> ${order.customer.address}</div>
        <div><b>Catatan:</b> ${order.note || "-"}</div>
        <hr>
        ${itemsHTML}
        <hr>
        <div class="d-flex justify-content-between fw-bold">
            <span>Total</span>
            <span>Rp ${Number(order.total ?? 0).toLocaleString("id-ID")}</span>
        </div>
    `;
}

// AUTO TIMELINE
let st = 1;
const ids = ["g1", "g2", "g3", "g4"];
setInterval(() => {
    if (st < 4) {
        document.getElementById(ids[st]).classList.add("active");
        st++;
    }
}, 3000);

// PDF GENERATOR
document.getElementById("btnPDF").onclick = () => {
  if (!order.id) return alert("Tidak ada order untuk dicetak!");
  const { jsPDF } = window.jspdf;
  const pdf = new jsPDF({ unit: "mm", format: "a4" });
  const w = pdf.internal.pageSize.getWidth();
  const center = w / 2;

  pdf.setFont("Helvetica", "bold");
  pdf.setFontSize(20);
  pdf.text("Bakso Malang Lestari 38", center, 16, { align: "center" });

  pdf.setFont("Helvetica", "normal");
  pdf.setFontSize(11);
  pdf.text("Gg. Sawo, RT.003/RW.001, Sawah Lama, Ciputat", center, 23, { align: "center" });
  pdf.text("Telp: 0896-3057-4763 | IG: @baksolestari38", center, 28, { align: "center" });
  pdf.setDrawColor(180);
  pdf.line(10, 33, w - 10, 33);

  const tanggal = new Date().toLocaleString("id-ID", {
    dateStyle: "long",
    timeStyle: "short"
  });

  pdf.setFont("Helvetica", "bold");
  pdf.setFontSize(13);
  pdf.text("INVOICE PEMESANAN", 10, 43);
  pdf.setFont("Helvetica", "normal");
  pdf.setFontSize(11);
  pdf.text(`Order ID : ${order.id}`, 10, 50);
  pdf.text(`Tanggal  : ${tanggal}`, 10, 56);
  pdf.text(`Metode Pembayaran : ${order.method}`, 10, 62);
  pdf.line(10, 68, w - 10, 68);

  pdf.setFont("Helvetica", "bold");
  pdf.text("Data Pelanggan:", 10, 78);
  pdf.setFont("Helvetica", "normal");
  pdf.text(`Nama   : ${order.customer.name}`, 10, 85);
  pdf.text(`No. HP : ${order.customer.phone}`, 10, 91);
  pdf.text(`Alamat : ${order.customer.address}`, 10, 97);
  pdf.text(`Catatan: ${order.note || "-"}`, 10, 103);
  pdf.line(10, 110, w - 10, 110);

  const tableData = order.items.map(item => [
    item.name,
    item.quantity ?? 1,
    "Rp " + Number(item.price ?? 0).toLocaleString("id-ID"),
    "Rp " + ((item.quantity ?? 1) * Number(item.price ?? 0)).toLocaleString("id-ID")
  ]);

  pdf.autoTable({
    head: [["Menu", "Qty", "Harga", "Subtotal"]],
    body: tableData,
    startY: 116,
    theme: "grid",
    headStyles: { fillColor: [0, 170, 19], textColor: 255, halign: "center" },
    styles: { fontSize: 11 }
  });

  const endY = pdf.lastAutoTable.finalY + 8;
  const ongkir = Number(order.shipping ?? 5000);
  const subtotal = Number(order.subtotal ?? 0);
  const totalAkhir = Number(order.total ?? subtotal + ongkir);

  pdf.setFont("Helvetica", "bold");
  pdf.text("Ringkasan Pembayaran:", 10, endY);
  pdf.setFont("Helvetica", "normal");
  pdf.setFontSize(11);
  pdf.text(`Subtotal     : Rp ${subtotal.toLocaleString("id-ID")}`, 10, endY + 8);
  pdf.text(`Ongkos Kirim : Rp ${ongkir.toLocaleString("id-ID")}`, 10, endY + 14);

  pdf.setFont("Helvetica", "bold");
  pdf.setFontSize(14);
  pdf.text(`TOTAL BAYAR : Rp ${totalAkhir.toLocaleString("id-ID")}`, w - 10, endY + 26, { align: "right" });

  pdf.setFont("Helvetica", "normal");
  pdf.setTextColor(120);
  pdf.text("Terima kasih telah memesan di Bakso Malang Lestari 38!", center, endY + 55, { align: "center" });
  pdf.text("Pesanan Anda sedang diproses. Tunjukkan invoice ini ketika pesanan tiba.", center, endY + 62, { align: "center" });
  pdf.text("— Sampai jumpa di pesanan berikutnya —", center, endY + 70, { align: "center" });

  pdf.save(`Invoice_${order.id}.pdf`);
};

// WHATSAPP
document.getElementById("btnWhatsApp").onclick = () => {
    if (!order.id) return alert("Tidak ada order untuk dikirim!");
    const wa = "628811307502";
    let text = `Pesanan Selesai%0AOrder ID: ${order.id}%0A%0A`;
    order.items.forEach(i => {
        const qty = i.quantity ?? 1;
        const price = Number(i.price ?? 0);
        text += `${i.name} x${qty} - Rp ${(qty * price).toLocaleString('id-ID')}%0A`;
    });
    text += `%0ATotal: Rp ${Number(order.total ?? 0).toLocaleString('id-ID')}`;
    window.open(`https://wa.me/${wa}?text=${text}`);
};

// HAPUS KERANJANG & LAST ORDER SAAT KEMBALI
document.getElementById("btnBack").onclick = () => {
    // Kosongkan cart
    localStorage.removeItem("bml_cart");
    localStorage.setItem("bml_cart", JSON.stringify([]));

    // Hapus data checkout (opsional)
    localStorage.removeItem("lastOrder");
    localStorage.removeItem("checkoutCart");

    // Redirect ke index
    window.location.href = "index.html";
};
</script>

</body>
</html>
