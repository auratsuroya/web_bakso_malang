<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Logout</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    body {
      font-family: Arial, sans-serif;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      background: linear-gradient(135deg, #0f3d2e, #28a745);
    }
    .logout-container {
      text-align: center;
      background: rgba(255,255,255,0.1);
      padding: 40px 30px;
      border-radius: 12px;
      backdrop-filter: blur(12px);
      color: #fff;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    .btn-logout {
      padding: 12px 30px;
      font-size: 18px;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, #d4af37, #f7e99c);
      color: #0f3d2e;
      cursor: pointer;
      transition: 0.3s;
    }
    .btn-logout:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 20px rgba(0,0,0,0.35);
    }

    /* Toast popup */
    .toast-popup {
      position: fixed;
      top: 20px;
      right: 20px;
      display: flex;
      align-items: center;
      gap: 10px;
      background: linear-gradient(135deg, #d4af37, #28a745);
      color: #fff;
      padding: 14px 20px;
      border-radius: 10px;
      font-weight: 600;
      opacity: 0;
      pointer-events: none;
      transform: translateY(-20px);
      transition: opacity 0.4s, transform 0.4s;
      z-index: 9999;
    }
    .toast-popup.show {
      opacity: 1;
      transform: translateY(0);
      pointer-events: auto;
    }
    #toastIcon {
      font-size: 20px;
    }
  </style>
</head>
<body>

<div class="logout-container">
  <h2>Logout</h2>
  <p>Klik tombol di bawah untuk logout dari akun Anda.</p>
  <button id="logoutBtn" class="btn-logout"><i class="bi bi-box-arrow-right"></i> Logout</button>
</div>

<!-- Toast Popup -->
<div id="toast" class="toast-popup d-none">
  <span id="toastIcon">✅</span>
  <span id="toastMessage"></span>
</div>

<script>
  document.addEventListener("DOMContentLoaded", () => {
    const logoutBtn = document.getElementById("logoutBtn");
    const toast = document.getElementById("toast");
    const toastMessage = document.getElementById("toastMessage");

    function showToast(message) {
      toastMessage.textContent = message;
      toast.classList.add("show");
      toast.classList.remove("d-none");

      setTimeout(() => {
        toast.classList.remove("show");
        setTimeout(() => toast.classList.add("d-none"), 400);
      }, 2000);
    }

    logoutBtn.addEventListener("click", () => {
      // Hapus data user
      localStorage.removeItem("userData");

      // Tampilkan toast
      showToast("Logout berhasil!");

      // Redirect ke login setelah 2.2 detik
      setTimeout(() => {
        window.location.href = "login.html";
      }, 2200);
    });
  });
</script>

</body>
</html>
