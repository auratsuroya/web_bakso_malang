<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar Akun - Bakso Malang Lestari 38</title>

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Bootstrap Icons -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

  <!-- Custom CSS -->
  <link rel="stylesheet" href="register.css">
</head>
<body>

  <!-- Background -->
  <div class="login-bg"></div>

  <!-- Register Wrapper -->
  <div class="d-flex align-items-center justify-content-center vh-100">
    <div class="login-card p-4 rounded-4 shadow-lg">

      <h2 class="text-center fw-bold mb-2 title-text">Daftar Akun</h2>
      <p class="text-center text-light mb-4">Buat akun untuk memesan lebih cepat</p>

      <form id="registerForm">

        <!-- Nama Lengkap -->
        <div class="mb-3">
          <input type="text" id="fullname" class="form-control" placeholder="Nama Lengkap" required>
        </div>

        <!-- Username -->
        <div class="mb-3">
          <input type="text" id="username" class="form-control" placeholder="Username" required>
        </div>

        <!-- Password -->
        <div class="mb-3 position-relative">
          <input type="password" id="password" class="form-control" placeholder="Password" required>
          <i class="bi bi-eye-slash-fill toggle-eye" id="togglePassword"></i>
        </div>

        <!-- Nomor HP -->
        <div class="mb-3">
          <input type="tel" id="phone" class="form-control" placeholder="Nomor HP / WhatsApp" required>
        </div>

        <!-- Alamat -->
        <div class="mb-3">
          <textarea id="address" class="form-control" rows="3" placeholder="Alamat Lengkap" required></textarea>
        </div>

        <!-- Button -->
        <button type="submit" class="btn btn-gold w-100 mt-2">Daftar Sekarang</button>
      </form>

      <!-- Error / Success Message -->
      <p id="errorMsg" class="text-danger text-center mt-3 d-none">Username sudah digunakan!</p>
      <p id="successMsg" class="text-success text-center mt-3 d-none fw-bold">
        Berhasil daftar! Mengalihkan...
      </p>

      <!-- Link Login -->
      <p class="text-center mt-3 text-light">
        Sudah punya akun?
        <a href="login.html" class="text-gold fw-bold">Login di sini</a>
      </p>

    </div>
  </div>

<script src="register.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
